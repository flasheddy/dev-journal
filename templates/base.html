<!doctype html>
<html lang="en" data-theme="mocha">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
    <meta name="theme-color" content="#1e1e2e">
    <link rel="canonical" href="{{ current_url | default(value=config.base_url) }}">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dev-journal-theme');
          document.documentElement.dataset.theme = saved === 'latte' ? 'latte' : 'mocha';
        } catch (_) {
          document.documentElement.dataset.theme = 'mocha';
        }
      }());
    </script>
    <link rel="stylesheet" href="{{ get_url(path="css/site.css") }}">
    <script defer src="{{ get_url(path="js/site.js") }}"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="site-header__inner shell">
        <a class="site-name" href="{{ get_url(path='@/_index.md') }}">Dev Journal</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <!-- <a href="{{ get_url(path='@/blog/_index.md') }}">Blog</a> -->
          <!-- <a href="{{ get_url(path='@/_index.md') }}#ensub">Pinned Project</a> -->
          <a class="external-link" href="https://github.com/flasheddy/dotfiles" target="_blank" rel="noopener noreferrer">
            Dotfiles <span aria-hidden="true">↗</span>
          </a>
          <a class="external-link" href="{{ config.extra.github_url }}" target="_blank" rel="noopener noreferrer">
            GitHub <span aria-hidden="true">↗</span>
          </a>
          <a class="external-link" href="mailto:{{ config.extra.email }}">
            Email <span aria-hidden="true">↗</span>
          </a>
          <button class="icon-button theme-toggle" type="button" data-theme-toggle aria-label="Switch to light theme" aria-pressed="false">
            <svg data-theme-icon="light" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
            </svg>
            <svg data-theme-icon="dark" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </nav>
      </div>
    </header>

    <main id="main-content">
      {% block content %}{% endblock content %}
    </main>

    <footer class="site-footer">
      <div class="shell site-footer__inner">
        <p>Dev Journal</p>
        <p>Built with Zola.</p>
      </div>
    </footer>
    <div class="sr-only" aria-live="polite" aria-atomic="true" data-copy-status></div>
  </body>
</html>
